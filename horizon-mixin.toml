# fog control: a native trait mod (docs/native-mods.md, "Trait mods"). Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "fog_control"
version = "0.1.0"

# The Horizon commit it is made for; unpinned, it builds on the instance's own.
# [compatibility]
# horizon_revision = "<40 hex digits>"

[api]
path = "api"
